services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=swapi-clone'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=root'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    image: swapi-clone-backend:latest
    environment:
      - 'DB_URL=jdbc:postgresql://postgres:5432/swapi-clone'
      - 'DB_USERNAME=root'
      - 'DB_PASSWORD=root'
    ports:
      - '8080:8080'
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
    image: swapi-clone-frontend:latest
    ports:
      - '4200:80'
    depends_on:
      - backend
volumes:
  # Declare the named volume here
  pgdata:
