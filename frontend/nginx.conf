server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    # Spring's ForwardedHeaderFilter (forward-headers-strategy: framework) switches
    # to X-Forwarded-* exclusively once any of them is present, ignoring the plain
    # Host header — so without X-Forwarded-Host it falls back to the http-default
    # port, rebuilding relation URLs as http://localhost/... instead of
    # http://localhost:4200/..., which then fail to load in the browser.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
